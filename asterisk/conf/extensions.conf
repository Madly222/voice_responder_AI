[avr]
exten => s,1,Answer()
 same => n,Ringing()
 same => n,Wait(1)
 same => n,Set(UUID=${SHELL(uuidgen | tr -d '\n')})
 same => n,Set(CALLER=${CALLERID(num)})
 same => n,Set(CHAN_NAME=${CHANNEL})
 same => n,System(curl -s -X POST -H "Content-Type: application/json" -d '{"phone":"${CALLER}","channel":"${CHAN_NAME}","lang":"${AVR_LANG}"}' http://faq-server:3000/tool/startCall)
 same => n,Set(CHANNEL(hangup_handler_push)=avr-hangup,s,1)
 same => n,Dial(AudioSocket/${ARG1}/${UUID})
 same => n,Hangup()
[avr-hangup]
exten => s,1,NoOp(Hangup handler - sending endCall)
 same => n,System(curl -s -X POST -H "Content-Type: application/json" -d '{"channel":"${CHANNEL}"}' http://faq-server:3000/tool/endCall)
 same => n,Return()
; Language menu: 1 = RO (avr-core), 2 = RU (avr-core-ru); no key or any other digit = RO.
; Recording: asterisk/sounds/lang-menu.wav (8 kHz, mono, 16-bit). Until the file exists the menu is skipped and the call goes to RO.
[avr-lang]
; Menu: either one file lang-menu.wav, or two in a row lang-menu-ro.wav + lang-menu-ru.wav (a key can be pressed at any time).
; No files: the menu is skipped and the call goes to RO. Folder: asterisk/sounds (sounds/custom inside the container).
exten => s,1,Answer()
 same => n,Set(SND=/var/lib/asterisk/sounds/custom)
 same => n,GotoIf($[${STAT(e,${SND}/lang-menu.wav)}]?one)
 same => n,GotoIf($[${STAT(e,${SND}/lang-menu-ro.wav)} & ${STAT(e,${SND}/lang-menu-ru.wav)}]?two)
 same => n,Goto(1,1)
 same => n(one),Set(MENU=custom/lang-menu)
 same => n,Goto(menu)
 same => n(two),Set(MENU=custom/lang-menu-ro&custom/lang-menu-ru)
 same => n(menu),Set(TIMEOUT(digit)=3)
 same => n,Background(${MENU})
 same => n,WaitExten(5)
exten => 1,1,Set(AVR_LANG=ro)
 same => n,GoSub(avr,s,1(avr-core:5001))
exten => 2,1,Set(AVR_LANG=ru)
 same => n,GoSub(avr,s,1(avr-core-ru:5001))
exten => i,1,Goto(1,1)
exten => t,1,Goto(1,1)
[demo]
exten => 5001,1,Goto(avr-lang,s,1)
exten => 5002,1,GoSub(avr,s,1(host.docker.internal:5001))
; test extensions, no menu
exten => 5003,1,Goto(avr-lang,2,1)
exten => 5004,1,Goto(avr-lang,1,1)
